name: Build Windows installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Frozen build + installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          if (Test-Path requirements-ocr.txt) {
            python -m pip install -r requirements-ocr.txt
          }
          python -m pip install pyinstaller pyinstaller-hooks-contrib

      - name: Install Inno Setup (best effort)
        continue-on-error: true
        run: choco install innosetup --no-progress -y

      - name: Build portable bundle and installer
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File packaging\build.ps1

      - name: Smoke test frozen executable
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP "tangerine-version.txt"
          $process = Start-Process -FilePath "dist\Tangerine\Tangerine.exe" `
            -ArgumentList "--version" -PassThru -Wait -RedirectStandardOutput $stdout
          if (Test-Path $stdout) { Get-Content $stdout }
          if ($process.ExitCode -ne 0) {
            throw "Tangerine.exe --version exited with code $($process.ExitCode)"
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tangerine-windows
          path: |
            dist/*-windows-portable.zip
            dist/*-Setup.exe
          if-no-files-found: error

      - name: Derive release version
        id: version
        shell: pwsh
        run: |
          $text = Get-Content tangerine\paths.py -Raw
          $match = [regex]::Match($text, 'APP_VERSION\s*=\s*"([^"]+)"')
          if (-not $match.Success) { throw "APP_VERSION not found in tangerine\paths.py" }
          "version=$($match.Groups[1].Value)" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Tangerine for Windows ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*-windows-portable.zip
            dist/*-Setup.exe
