name: Build Windows installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Frozen build + installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          if (Test-Path requirements-ocr.txt) {
            python -m pip install -r requirements-ocr.txt
          }
          python -m pip install pyinstaller pyinstaller-hooks-contrib

      - name: Install Inno Setup (best effort)
        continue-on-error: true
        run: choco install innosetup --no-progress -y

      - name: Run regression tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -s -vv --junitxml=build/test-results.xml

      - name: Build portable bundle and installer
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File packaging\build.ps1

      - name: Require installer and matching release tag
        shell: pwsh
        run: |
          $match = [regex]::Match((Get-Content tangerine\paths.py -Raw), 'APP_VERSION\s*=\s*"([^"]+)"')
          if (-not $match.Success) { throw 'APP_VERSION is missing' }
          $version = $match.Groups[1].Value
          if (-not (Test-Path "dist\Tangerine-$version-Setup.exe")) { throw 'Installer was not produced' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw 'Release tag does not match APP_VERSION'
          }

      - name: Smoke test frozen executable
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP "tangerine-version.txt"
          $process = Start-Process -FilePath "dist\Tangerine\Tangerine.exe" `
            -ArgumentList "--version" -WindowStyle Hidden -PassThru -Wait -RedirectStandardOutput $stdout
          if (Test-Path $stdout) { Get-Content $stdout }
          if ($process.ExitCode -ne 0) {
            throw "Tangerine.exe --version exited with code $($process.ExitCode)"
          }

          $process = Start-Process -FilePath "dist\Tangerine\Tangerine.exe" `
            -ArgumentList "--smoke-webengine" -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(30000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "Tangerine.exe --smoke-webengine timed out after 30 seconds"
          }
          $process.Refresh()
          if ($process.ExitCode -ne 0) {
            throw "Tangerine.exe --smoke-webengine exited with code $($process.ExitCode)"
          }

          $process = Start-Process -FilePath "dist\Tangerine\Tangerine.exe" `
            -ArgumentList "--smoke-image-pdf" -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(30000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "Tangerine.exe --smoke-image-pdf timed out"
          }
          $process.Refresh()
          if ($process.ExitCode -ne 0) { throw "Image PDF runtime validation failed" }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tangerine-windows
          path: |
            dist/*-windows-portable.zip
            dist/*-Setup.exe
          if-no-files-found: error

      - name: Upload validation receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tangerine-validation
          path: |
            build/test-results.xml
            ${{ runner.temp }}/Tangerine-image-pdf-smoke.json
            ${{ runner.temp }}/Tangerine-webengine-smoke.log
          if-no-files-found: warn

      - name: Derive release version
        id: version
        shell: pwsh
        run: |
          $text = Get-Content tangerine\paths.py -Raw
          $match = [regex]::Match($text, 'APP_VERSION\s*=\s*"([^"]+)"')
          if (-not $match.Success) { throw "APP_VERSION not found in tangerine\paths.py" }
          "version=$($match.Groups[1].Value)" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Tangerine for Windows ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*-windows-portable.zip
            dist/*-Setup.exe
